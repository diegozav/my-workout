<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Rutina" />
  <meta name="theme-color" content="#0D1117" />
  <title>Lift & Cut — Rutina Gym</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #FF6B35;
      --primary-dim: rgba(255,107,53,0.12);
      --primary-border: rgba(255,107,53,0.3);
      --accent: #58A6FF;
      --success: #3FB950;
      --warning: #E3B341;
      --danger: #F85149;
      --dark: #0D1117;
      --darker: #010409;
      --card: #161B22;
      --card2: #1C2128;
      --border: #30363D;
      --text: #E6EDF3;
      --muted: #7D8590;
      --display: 'Barlow Condensed', sans-serif;
      --body: 'Barlow', sans-serif;
    }
    html, body, #root { min-height: 100%; background: var(--darker); color: var(--text); font-family: var(--body); }
    body { padding-bottom: 48px; }

    /* NAV TABS */
    .nav-tabs {
      display: flex; background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-tab {
      flex: 1; padding: 13px 8px; background: none; border: none;
      font-family: var(--display); font-size: 13px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); cursor: pointer; transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }
    .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* HERO */
    .hero {
      background: linear-gradient(155deg, #1a0800 0%, #0D1117 55%, #00091a 100%);
      padding: 28px 16px 22px; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -80px; right: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(255,107,53,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-label { font-family: var(--display); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
    .hero h1 { font-family: var(--display); font-size: 38px; font-weight: 800; line-height: 1; text-transform: uppercase; margin-bottom: 5px; }
    .hero h1 span { color: var(--primary); }
    .hero-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px; font-size: 12px; font-weight: 600; color: var(--accent); }

    /* WEEK STRIP */
    .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--border); }
    .wd { text-align: center; padding: 7px 2px; border-radius: 7px; border: 1px solid transparent; }
    .wd-name { font-family: var(--display); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .wd-icon { font-size: 16px; }
    .wd-label { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .wd.gym { border-color: var(--primary-border); background: var(--primary-dim); }
    .wd.gym .wd-name { color: var(--primary); }
    .wd.opt { border-color: rgba(227,179,65,0.3); background: rgba(227,179,65,0.07); }
    .wd.opt .wd-name { color: var(--warning); }

    /* FOOTBALL NOTE */
    .fn { margin: 10px 16px 4px; background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.2); border-radius: 10px; padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start; }
    .fn p { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .fn strong { color: var(--accent); }

    /* STATS */
    .stats { display: flex; gap: 8px; padding: 10px 16px; }
    .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 3px; }
    .stat-val { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--primary); }

    /* START WORKOUT BUTTON */
    .start-workout-wrap { padding: 4px 16px 12px; }
    .start-btn {
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      font-family: var(--display); font-size: 18px; font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .start-btn.idle { background: var(--primary); color: white; }
    .start-btn.idle:active { background: #e55a25; transform: scale(0.98); }
    .start-btn.active { background: rgba(248,81,73,0.15); border: 2px solid var(--danger); color: var(--danger); }

    /* ACTIVE WORKOUT BAR */
    .workout-bar {
      position: sticky; top: 42px; z-index: 99;
      background: var(--card2); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    }
    .workout-bar .wb-label { font-family: var(--display); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .workout-bar .wb-time { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--success); flex: 1; }
    .workout-bar .wb-stop { background: rgba(248,81,73,0.15); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 6px 14px; font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }

    /* REST TIMER MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; backdrop-filter: blur(4px);
    }
    .rest-modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 32px 28px; text-align: center; width: 300px; max-width: 90vw;
    }
    .rest-modal h3 { font-family: var(--display); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .rest-modal .ex-resting { font-size: 13px; color: var(--text); margin-bottom: 24px; font-weight: 500; }
    .timer-ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
    .timer-ring-wrap svg { transform: rotate(-90deg); }
    .timer-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .timer-ring-progress { fill: none; stroke: var(--primary); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-ring-progress.urgent { stroke: var(--danger); }
    .timer-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .timer-num { font-family: var(--display); font-size: 44px; font-weight: 800; color: var(--text); line-height: 1; }
    .timer-sec { font-size: 12px; color: var(--muted); }
    .rest-presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .preset-btn { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .preset-btn:active, .preset-btn.sel { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
    .rest-actions { display: flex; gap: 8px; }
    .rest-skip { flex: 1; padding: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--muted); cursor: pointer; }
    .rest-restart { flex: 1; padding: 12px; background: var(--primary-dim); border: 1px solid var(--primary); border-radius: 10px; font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--primary); cursor: pointer; }

    /* DAY CARDS */
    .days { padding: 0 16px; }
    .day-card { margin-bottom: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .day-card.optional { border-color: rgba(227,179,65,0.3); }
    .day-trigger {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: var(--card); border: none;
      border-left: 4px solid var(--primary); cursor: pointer; text-align: left; transition: background 0.2s;
    }
    .day-card.optional .day-trigger { border-left-color: var(--warning); }
    .day-trigger:active { background: var(--card2); }
    .day-trigger.done-day { border-left-color: var(--success); background: rgba(63,185,80,0.06); }
    .day-emoji { font-size: 22px; flex-shrink: 0; }
    .day-info { flex: 1; min-width: 0; }
    .day-name { font-family: var(--display); font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text); margin-bottom: 1px; }
    .day-sub { font-size: 11px; color: var(--muted); }
    .day-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .time-pill { background: var(--primary-dim); color: var(--primary); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }
    .opt-pill { background: rgba(227,179,65,0.14); color: var(--warning); border-radius: 6px; padding: 3px 8px; font-size: 10px; font-weight: 600; }
    .prog-ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--muted); transition: all 0.3s; }
    .prog-ring.full { border-color: var(--success); background: var(--success); color: white; font-size: 15px; }
    .chevron { color: var(--muted); font-size: 12px; transition: transform 0.25s; }
    .chevron.open { transform: rotate(180deg); }

    /* EXERCISE LIST */
    .ex-list { background: #0b1017; border-top: 1px solid var(--border); }
    .ex-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid rgba(48,54,61,0.5); cursor: pointer; transition: background 0.15s; user-select: none; }
    .ex-item:last-child { border-bottom: none; }
    .ex-item:active { background: rgba(255,255,255,0.03); }
    .ex-check { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.2s; background: var(--card); }
    .ex-item.done .ex-check { background: var(--accent); border-color: var(--accent); color: white; }
    .ex-content { flex: 1; }
    .ex-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .ex-item.done .ex-name { color: var(--muted); text-decoration: line-through; }
    .ex-detail { font-size: 11px; color: var(--muted); }
    .ex-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .rest-btn { background: rgba(255,107,53,0.1); border: 1px solid var(--primary-border); border-radius: 7px; padding: 5px 10px; font-size: 11px; font-weight: 600; color: var(--primary); cursor: pointer; white-space: nowrap; }
    .compound-tag { display: inline-block; background: rgba(63,185,80,0.15); color: var(--success); font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 5px; font-weight: 700; vertical-align: middle; }

    /* NUTRITION */
    .nutrition { margin: 14px 16px 0; background: rgba(255,107,53,0.07); border-left: 3px solid var(--primary); border-radius: 8px; padding: 14px; }
    .nutrition h3 { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 10px; letter-spacing: 0.5px; }
    .nutrition p { font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.5; }
    .nutrition p:last-child { margin-bottom: 0; }
    .nutrition strong { color: var(--text); }

    /* NOTES */
    .notes { margin: 12px 16px 0; background: rgba(0,60,120,0.1); border: 1px solid rgba(88,166,255,0.15); border-radius: 10px; padding: 14px; }
    .notes h3 { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    .notes p { font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.55; }

    /* RESET */
    .reset-btn { display: block; width: calc(100% - 32px); margin: 14px 16px 0; padding: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; font-family: var(--body); cursor: pointer; transition: all 0.2s; }
    .reset-btn:active { background: var(--card2); color: var(--text); }

    /* HISTORY TAB */
    .history-wrap { padding: 16px; }
    .history-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .history-empty .he-icon { font-size: 48px; margin-bottom: 12px; }
    .history-entry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .he-header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .he-date { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
    .he-day { font-size: 12px; color: var(--accent); background: rgba(88,166,255,0.1); border-radius: 6px; padding: 3px 9px; font-weight: 600; }
    .he-duration { font-family: var(--display); font-size: 14px; color: var(--success); font-weight: 700; }
    .he-exercises { padding: 0 16px 12px; }
    .he-ex { font-size: 12px; color: var(--muted); padding: 4px 0; border-bottom: 1px solid rgba(48,54,61,0.4); display: flex; align-items: center; gap: 8px; }
    .he-ex:last-child { border-bottom: none; }
    .he-ex::before { content: '✓'; color: var(--success); font-size: 11px; flex-shrink: 0; }
    .he-stats { display: flex; gap: 8px; padding: 0 16px 14px; }
    .he-stat { flex: 1; background: var(--card2); border-radius: 8px; padding: 8px; text-align: center; }
    .he-stat-val { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--primary); }
    .he-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .clear-history-btn { display: block; width: 100%; margin-top: 8px; padding: 12px; background: var(--card); border: 1px solid rgba(248,81,73,0.3); border-radius: 10px; color: var(--danger); font-size: 13px; font-family: var(--body); cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const DAYS = [
      {
        id: 'lunes', emoji: '🦵', name: 'Lunes — Abdomen & Piernas', sub: 'Tren inferior · Core · 30 min', optional: false,
        exercises: [
          { name: 'Sentadilla con Barra', detail: '3 × 8 reps · Descanso: 90s · Peso moderado', compound: true, rest: 90 },
          { name: 'Prensa de Piernas', detail: '3 × 10-12 reps · Descanso: 90s', compound: false, rest: 90 },
          { name: 'Curl Femoral en Máquina', detail: '3 × 12 reps · Descanso: 60s', compound: false, rest: 60 },
          { name: 'Crunch en Suelo', detail: '3 × 20 reps · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Elevaciones de Piernas en Suelo', detail: '3 × 15 reps · Descanso: 45s', compound: false, rest: 45 },
        ],
      },
      {
        id: 'martes', emoji: '💪', name: 'Martes — Brazos', sub: 'Bíceps + Tríceps · Supersets · 30 min', optional: false,
        exercises: [
          { name: 'Press Cerrado · Superset A', detail: '4 × 8 reps · Sin descanso → ir directo a Curl con Barra', compound: true, rest: 10 },
          { name: 'Curl con Barra · Superset A', detail: '4 × 8 reps · Descanso: 60s al terminar el par', compound: false, rest: 60 },
          { name: 'Press Francés · Superset B', detail: '3 × 10 reps · Sin descanso → ir directo a Curl Predicador', compound: false, rest: 10 },
          { name: 'Curl Predicador · Superset B', detail: '3 × 10 reps · Descanso: 60s al terminar el par', compound: false, rest: 60 },
          { name: 'Extensiones en Polea · Superset C', detail: '3 × 12 reps · Sin descanso → ir directo a Curl Martillo', compound: false, rest: 10 },
          { name: 'Curl Martillo · Superset C', detail: '3 × 12 reps · Descanso: 45s al terminar el par', compound: false, rest: 45 },
        ],
      },
      {
        id: 'miercoles', emoji: '🔥', name: 'Miércoles — Core Completo', sub: 'Abdomen · Oblicuos · 30 min', optional: true,
        exercises: [
          { name: 'Crunch en Suelo', detail: '3 × 20 reps · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Crunch Bicicleta', detail: '3 × 20 reps (cada lado) · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Elevaciones de Piernas en Suelo', detail: '3 × 15 reps · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Russian Twist', detail: '3 × 20 reps · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Plancha Lateral', detail: '3 × 30s cada lado · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Dead Bug', detail: '3 × 10 reps · Descanso: 45s', compound: false, rest: 45 },
        ],
      },
      {
        id: 'jueves', emoji: '💥', name: 'Jueves — Espalda', sub: 'Tracción · Fuerza · 30 min', optional: false,
        exercises: [
          { name: 'Remo Inclinado con Barra', detail: '3 × 8 reps · Descanso: 90s · Peso pesado', compound: true, rest: 90 },
          { name: 'Dominadas o Lat Pulldown', detail: '3 × 8-10 reps · Descanso: 90s', compound: true, rest: 90 },
          { name: 'Remo en Máquina', detail: '3 × 12 reps · Descanso: 60s', compound: false, rest: 60 },
        ],
      },
      {
        id: 'viernes', emoji: '⚡', name: 'Viernes — Hombros & Antebrazos', sub: 'Deltoides · Antebrazos · 30 min', optional: false,
        exercises: [
          { name: 'Press Militar con Barra', detail: '3 × 8 reps · Descanso: 90s · Peso moderado', compound: true, rest: 90 },
          { name: 'Elevaciones Laterales', detail: '3 × 12-15 reps · Descanso: 60s', compound: false, rest: 60 },
          { name: 'Pájaros en Máquina (Trasero)', detail: '3 × 12 reps · Descanso: 60s', compound: false, rest: 60 },
          { name: 'Curl Inverso con Barra', detail: '3 × 12 reps · Descanso: 45s', compound: false, rest: 45 },
          { name: 'Curl de Muñeca con Barra', detail: '3 × 15 reps · Descanso: 45s', compound: false, rest: 45 },
        ],
      },
    ];

    const WEEK = [
      { name: 'Lun', icon: '🦵', label: 'Piernas', cls: 'gym' },
      { name: 'Mar', icon: '💪', label: 'Brazos', cls: 'gym' },
      { name: 'Mié', icon: '🔥', label: 'Core', cls: 'opt' },
      { name: 'Jue', icon: '💥', label: 'Espalda', cls: 'gym' },
      { name: 'Vie', icon: '⚡', label: 'Hombros', cls: 'gym' },
      { name: 'Sáb', icon: '⚽', label: 'Fútbol', cls: '' },
      { name: 'Dom', icon: '😴', label: 'Descanso', cls: '' },
    ];

    const STORAGE_KEY = 'lift-cut-v2';
    const HISTORY_KEY = 'lift-cut-history-v1';

    function loadChecked() { try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : {}; } catch { return {}; } }
    function loadHistory() { try { const s = localStorage.getItem(HISTORY_KEY); return s ? JSON.parse(s) : []; } catch { return []; } }
    function saveChecked(v) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch {} }
    function saveHistory(v) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(v)); } catch {} }

    function fmtTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });
    }

    /* REST TIMER MODAL */
    function RestTimer({ exName, defaultSecs, onClose }) {
      const [total, setTotal] = useState(defaultSecs);
      const [remaining, setRemaining] = useState(defaultSecs);
      const [running, setRunning] = useState(true);
      const intervalRef = useRef(null);

      useEffect(() => {
        if (running && remaining > 0) {
          intervalRef.current = setInterval(() => setRemaining(r => r - 1), 1000);
        } else if (remaining === 0) {
          clearInterval(intervalRef.current);
          setRunning(false);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
        return () => clearInterval(intervalRef.current);
      }, [running, remaining]);

      const setPreset = (s) => { clearInterval(intervalRef.current); setTotal(s); setRemaining(s); setRunning(true); };
      const restart = () => { clearInterval(intervalRef.current); setRemaining(total); setRunning(true); };

      const radius = 54;
      const circ = 2 * Math.PI * radius;
      const progress = remaining / total;
      const offset = circ * (1 - progress);
      const urgent = remaining <= 10 && remaining > 0;
      const done = remaining === 0;

      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="rest-modal">
            <h3>⏱ Descanso</h3>
            <div className="ex-resting">{exName}</div>

            <div className="timer-ring-wrap">
              <svg width="140" height="140" viewBox="0 0 120 120">
                <circle className="timer-ring-bg" cx="60" cy="60" r={radius} />
                <circle
                  className={`timer-ring-progress${urgent ? ' urgent' : ''}`}
                  cx="60" cy="60" r={radius}
                  strokeDasharray={circ}
                  strokeDashoffset={offset}
                />
              </svg>
              <div className="timer-center">
                <div className="timer-num" style={{color: done ? 'var(--success)' : urgent ? 'var(--danger)' : 'var(--text)'}}>
                  {done ? '✓' : fmtTime(remaining)}
                </div>
                <div className="timer-sec">{done ? '¡Listo!' : 'segundos'}</div>
              </div>
            </div>

            <div className="rest-presets">
              {[60, 90, 120, 180].map(s => (
                <button key={s} className={`preset-btn${total === s ? ' sel' : ''}`} onClick={() => setPreset(s)}>
                  {s < 60 ? `${s}s` : `${s/60}min`}
                </button>
              ))}
            </div>

            <div className="rest-actions">
              <button className="rest-skip" onClick={onClose}>Saltar</button>
              <button className="rest-restart" onClick={restart}>Reiniciar</button>
            </div>
          </div>
        </div>
      );
    }

    /* EXERCISE ITEM */
    function ExItem({ dayId, exIdx, name, detail, compound, rest, checked, onToggle, onRest, workoutActive }) {
      return (
        <div className={`ex-item${checked ? ' done' : ''}`} onClick={() => onToggle(dayId, exIdx)}>
          <div className="ex-check">{checked ? '✓' : ''}</div>
          <div className="ex-content">
            <div className="ex-name">
              {name}{compound && <span className="compound-tag">COMPUESTO</span>}
            </div>
            <div className="ex-detail">{detail}</div>
          </div>
          {workoutActive && (
            <div className="ex-right" onClick={e => { e.stopPropagation(); onRest(name, rest); }}>
              <button className="rest-btn">⏱ {rest >= 60 ? `${rest/60}m` : `${rest}s`}</button>
            </div>
          )}
        </div>
      );
    }

    /* DAY CARD */
    function DayCard({ day, checked, open, onToggle, onToggleEx, onRest, workoutActive }) {
      const total = day.exercises.length;
      const done = day.exercises.filter((_, i) => checked[`${day.id}-${i}`]).length;
      const allDone = done === total;

      return (
        <div className={`day-card${day.optional ? ' optional' : ''}`}>
          <button className={`day-trigger${allDone ? ' done-day' : ''}`} onClick={onToggle}>
            <span className="day-emoji">{day.emoji}</span>
            <div className="day-info">
              <div className="day-name">{day.name}</div>
              <div className="day-sub">{day.sub}</div>
            </div>
            <div className="day-right">
              {day.optional && <span className="opt-pill">OPCIONAL</span>}
              <span className="time-pill">30 min</span>
              <div className={`prog-ring${allDone ? ' full' : ''}`}>{allDone ? '✓' : `${done}/${total}`}</div>
              <span className={`chevron${open ? ' open' : ''}`}>▼</span>
            </div>
          </button>
          {open && (
            <div className="ex-list">
              {day.exercises.map((ex, i) => (
                <ExItem
                  key={i} dayId={day.id} exIdx={i}
                  name={ex.name} detail={ex.detail} compound={ex.compound} rest={ex.rest}
                  checked={!!checked[`${day.id}-${i}`]}
                  onToggle={onToggleEx} onRest={onRest} workoutActive={workoutActive}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    /* HISTORY TAB */
    function HistoryTab({ history, onClear }) {
      if (history.length === 0) return (
        <div className="history-empty">
          <div className="he-icon">📋</div>
          <div>Aún no tienes entrenamientos registrados.</div>
          <div style={{marginTop:8,fontSize:12}}>Pulsa <strong style={{color:'var(--primary)'}}>Empezar Entrenamiento</strong> para comenzar.</div>
        </div>
      );

      return (
        <div className="history-wrap">
          {[...history].reverse().map((entry, i) => (
            <div key={i} className="history-entry">
              <div className="he-header">
                <div className="he-date">{fmtDate(entry.timestamp)}</div>
                <span className="he-day">{entry.dayName}</span>
                <span className="he-duration">⏱ {fmtTime(entry.duration)}</span>
              </div>
              <div className="he-stats">
                <div className="he-stat">
                  <div className="he-stat-val">{entry.completed}</div>
                  <div className="he-stat-label">Ejercicios</div>
                </div>
                <div className="he-stat">
                  <div className="he-stat-val">{Math.round(entry.duration / 60)}min</div>
                  <div className="he-stat-label">Duración</div>
                </div>
                <div className="he-stat">
                  <div className="he-stat-val">{entry.total > 0 ? Math.round((entry.completed/entry.total)*100) : 0}%</div>
                  <div className="he-stat-label">Completado</div>
                </div>
              </div>
              {entry.exercises && entry.exercises.length > 0 && (
                <div className="he-exercises">
                  {entry.exercises.map((ex, j) => <div key={j} className="he-ex">{ex}</div>)}
                </div>
              )}
            </div>
          ))}
          <button className="clear-history-btn" onClick={onClear}>🗑 Borrar historial</button>
        </div>
      );
    }

    /* MAIN APP */
    function App() {
      const [tab, setTab] = useState('routine');
      const [checked, setChecked] = useState(loadChecked);
      const [openDays, setOpenDays] = useState({});
      const [history, setHistory] = useState(loadHistory);

      // Workout timer
      const [workoutActive, setWorkoutActive] = useState(false);
      const [workoutSeconds, setWorkoutSeconds] = useState(0);
      const [workoutStartChecked, setWorkoutStartChecked] = useState(null);
      const workoutRef = useRef(null);

      // Rest timer
      const [restModal, setRestModal] = useState(null); // { exName, secs }

      useEffect(() => { saveChecked(checked); }, [checked]);

      // Workout stopwatch
      useEffect(() => {
        if (workoutActive) {
          workoutRef.current = setInterval(() => setWorkoutSeconds(s => s + 1), 1000);
        } else {
          clearInterval(workoutRef.current);
        }
        return () => clearInterval(workoutRef.current);
      }, [workoutActive]);

      const startWorkout = () => {
        setWorkoutActive(true);
        setWorkoutSeconds(0);
        setWorkoutStartChecked({ ...checked });
      };

      const stopWorkout = () => {
        if (!window.confirm('¿Finalizar el entrenamiento y guardarlo en el historial?')) return;

        // Calcular ejercicios completados durante este entreno
        const completedExercises = [];
        let completedCount = 0;
        let totalCount = 0;

        DAYS.forEach(day => {
          day.exercises.forEach((ex, i) => {
            const key = `${day.id}-${i}`;
            totalCount++;
            const wasChecked = workoutStartChecked ? !!workoutStartChecked[key] : false;
            const isChecked = !!checked[key];
            if (isChecked && !wasChecked) {
              completedExercises.push(ex.name);
              completedCount++;
            } else if (isChecked) {
              completedCount++;
            }
          });
        });

        // Detectar qué día fue
        const activeDays = DAYS.filter(day =>
          day.exercises.some((_, i) => {
            const key = `${day.id}-${i}`;
            return !!checked[key] && !(workoutStartChecked && workoutStartChecked[key]);
          })
        );
        const dayName = activeDays.length > 0 ? activeDays[0].emoji + ' ' + activeDays[0].id.charAt(0).toUpperCase() + activeDays[0].id.slice(1) : 'Entrenamiento';

        const entry = {
          timestamp: Date.now(),
          duration: workoutSeconds,
          dayName,
          completed: completedCount,
          total: totalCount,
          exercises: completedExercises,
        };

        const newHistory = [...history, entry];
        setHistory(newHistory);
        saveHistory(newHistory);
        setWorkoutActive(false);
        setWorkoutSeconds(0);
        setWorkoutStartChecked(null);
      };

      const toggleEx = useCallback((dayId, exIdx) => {
        const key = `${dayId}-${exIdx}`;
        setChecked(prev => ({ ...prev, [key]: !prev[key] }));
      }, []);

      const toggleDay = useCallback((dayId) => {
        setOpenDays(prev => ({ ...prev, [dayId]: !prev[dayId] }));
      }, []);

      const openRest = (exName, secs) => setRestModal({ exName, secs });
      const closeRest = () => setRestModal(null);

      const resetWeek = () => {
        if (window.confirm('¿Restablecer todo el progreso semanal?')) {
          setChecked({});
          saveChecked({});
        }
      };

      const clearHistory = () => {
        if (window.confirm('¿Borrar todo el historial de entrenamientos?')) {
          setHistory([]);
          saveHistory([]);
        }
      };

      return (
        <>
          {/* REST TIMER MODAL */}
          {restModal && <RestTimer exName={restModal.exName} defaultSecs={restModal.secs} onClose={closeRest} />}

          {/* NAV */}
          <div className="nav-tabs">
            <button className={`nav-tab${tab === 'routine' ? ' active' : ''}`} onClick={() => setTab('routine')}>📋 Rutina</button>
            <button className={`nav-tab${tab === 'history' ? ' active' : ''}`} onClick={() => setTab('history')}>📅 Historial</button>
          </div>

          {tab === 'history' ? (
            <HistoryTab history={history} onClear={clearHistory} />
          ) : (
            <>
              {/* HERO */}
              <div className="hero">
                <div className="hero-label">💪 Tu rutina personalizada</div>
                <h1>Volumen &<br /><span>Brazos</span></h1>
                <div className="hero-sub">34 años · 80 kg · 174 cm · Nivel intermedio</div>
                <div className="chips">
                  <span className="chip">4 días/semana</span>
                  <span className="chip">30 min/sesión</span>
                  <span className="chip">Enfoque: Brazos</span>
                </div>
              </div>

              {/* ACTIVE WORKOUT BAR */}
              {workoutActive && (
                <div className="workout-bar">
                  <div>
                    <div className="wb-label">Entrenando</div>
                    <div className="wb-time">{fmtTime(workoutSeconds)}</div>
                  </div>
                  <button className="wb-stop" onClick={stopWorkout}>⏹ Finalizar</button>
                </div>
              )}

              {/* WEEK STRIP */}
              <div className="week-strip">
                {WEEK.map((w, i) => (
                  <div key={i} className={`wd${w.cls ? ' ' + w.cls : ''}`}>
                    <div className="wd-name">{w.name}</div>
                    <div className="wd-icon">{w.icon}</div>
                    <div className="wd-label">{w.label}</div>
                  </div>
                ))}
              </div>

              {/* FOOTBALL NOTE */}
              <div className="fn">
                <span style={{fontSize:20, flexShrink:0}}>⚽</span>
                <p><strong>Nota fútbol:</strong> Sábado de fútbol ya cubre cardio y pierna extra. Si juegas entre semana, descansa o reduce intensidad ese día.</p>
              </div>

              {/* STATS */}
              <div className="stats">
                <div className="stat"><div className="stat-label">IMC</div><div className="stat-val">26.4</div></div>
                <div className="stat"><div className="stat-label">Calorías</div><div className="stat-val">1,900</div></div>
                <div className="stat"><div className="stat-label">Proteína</div><div className="stat-val">160g</div></div>
              </div>

              {/* START BUTTON */}
              <div className="start-workout-wrap">
                {!workoutActive ? (
                  <button className="start-btn idle" onClick={startWorkout}>🏋️ Empezar Entrenamiento</button>
                ) : (
                  <button className="start-btn active" onClick={stopWorkout}>⏹ Finalizar Entrenamiento · {fmtTime(workoutSeconds)}</button>
                )}
              </div>

              {/* DAYS */}
              <div className="days">
                {DAYS.map(day => (
                  <DayCard
                    key={day.id} day={day} checked={checked}
                    open={!!openDays[day.id]}
                    onToggle={() => toggleDay(day.id)}
                    onToggleEx={toggleEx}
                    onRest={openRest}
                    workoutActive={workoutActive}
                  />
                ))}
              </div>

              {/* NUTRITION */}
              <div className="nutrition">
                <h3>🥗 NUTRICIÓN PARA VOLUMEN DE BRAZOS</h3>
                <p><strong>Calorías:</strong> ~2,200 kcal/día (superávit leve para ganar músculo)</p>
                <p><strong>Macros:</strong> 160g proteína · 240g carbohidratos · 65g grasas</p>
                <p><strong>Proteína:</strong> Distribuye en 4-5 comidas de ~40g cada una</p>
                <p><strong>Carbohidratos:</strong> Prioriza antes y después del entreno</p>
                <p><strong>Días de fútbol:</strong> Come un poco más (~2,400 kcal)</p>
                <p><strong>Agua:</strong> 3-4 litros diarios</p>
              </div>

              {/* NOTES */}
              <div className="notes">
                <h3>📋 CLAVES DE ESTA RUTINA</h3>
                <p>• Martes: brazos frescos = más peso, más reps, más músculo real</p>
                <p>• Supersets: tríceps trabaja, bíceps descansa y viceversa — no pierdas tiempo</p>
                <p>• Miércoles opcional: si vas, suma core; si no, sin culpa</p>
                <p>• Jueves-Viernes: grupos distintos, está bien ir seguidos</p>
                <p>• Progresa subiendo peso cada semana en sentadilla, remo y press militar</p>
              </div>

              <button className="reset-btn" onClick={resetWeek}>🔄 Restablecer progreso semanal</button>
            </>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
